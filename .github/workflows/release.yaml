name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.target }}
        run: |
          IFS='/' read -r os arch <<< "${{ matrix.target }}"
          export GOARCH=$arch
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o feedkit-${os}-${arch}${ext} ./cmd/feedkit
          tar -czf feedkit-${os}-${arch}.tar.gz feedkit-${os}-${arch}${ext}
      - uses: actions/upload-artifact@v4
        with:
          name: feedkit-${{ matrix.target }}
          path: feedkit-*.tar.gz

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifacts@v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.tar.gz" -exec sha256sum {} \; > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/feedkit-*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
