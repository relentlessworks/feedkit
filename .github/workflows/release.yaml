name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
            - goos: windows
              goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/feedkit${ext}" ./cmd/feedkit
          cd dist && tar -czf "feedkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "feedkit${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: feedkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/feedkit-*.tar.gz

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -name "*.tar.gz" -exec sha256sum {} \; > checksums.txt
          cat checksums.txt
      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/feedkit-*.tar.gz
            artifacts/checksums.txt
