name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o feedkit-${GOOS}-${GOARCH}${ext} ./cmd/feedkit
          tar -czf feedkit-${GOOS}-${GOARCH}.tar.gz feedkit-${GOOS}-${GOARCH}${ext}
      - uses: actions/upload-artifact@v4
        with:
          name: feedkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: feedkit-*.tar.gz

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.tar.gz" -exec sha256sum {} \; > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/feedkit-*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
